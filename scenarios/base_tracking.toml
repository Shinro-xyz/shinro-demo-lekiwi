# Base tracking: closed-loop Trajectory -> MPC_LTI -> Kalman -> HolonomicMobileRobot.
# The reference is a clamped cubic B-spline (configs/trajectories/base_bspline.toml).
[scenario]
name = "base_tracking"
description = "MPC_LTI + Kalman filter track a B-spline path on the holonomic base"
duration = 8.0
dt = 0.02
tolerance = { steady_state = 0.05, estimator = 0.03 }
input_limits = { min = [-0.5, -0.5, -1.0], max = [0.5, 0.5, 1.0] }

[physics]
preset = "lekiwi"

[plant]
name = "base"
type = "HolonomicMobileRobot"
config = "configs/plants/holonomic_base.toml"

[controller]
type = "MPC_LTI"
config = "configs/controllers/mpc_lti_base.toml"

[estimator]
type = "KalmanFilter"
config = "configs/estimators/kalman_base.toml"

[trajectory]
type = "bspline"
config = "configs/trajectories/base_bspline.toml"

[sim]
config = "configs/robot_config.toml"

[noise.measurement]
std = [0.01, 0.01, 0.02]

# Compile-time spec for the compilation pipeline. n_x / n_u are derived from the
# [plant] section; MPC needs its QP solver baked too.
[compile]
optimize = "release"
artifact_name = "libbase"
solver = "emosqp"
